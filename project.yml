name: Catedra
options:
  bundleIdPrefix: com.cmendoza
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 28U4T9UK9R
targets:
  Catedra:
    type: application
    platform: macOS
    sources:
      - path: Catedra
        excludes:
          - "Resources/Sync/**"
      - path: Catedra/Resources/Sync/sync_moodle.py
        buildPhase: resources
      - path: Shared
    dependencies:
      - target: CatedraWidget
        embed: true
    entitlements:
      path: Config/Catedra.entitlements
      properties:
        com.apple.security.application-groups:
          - 28U4T9UK9R.com.cmendoza.catedra
    info:
      path: Config/Catedra-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.cmendoza.catedra
            CFBundleURLSchemes:
              - catedra
    settings:
      base:
        PRODUCT_NAME: Catedra
        PRODUCT_BUNDLE_IDENTIFIER: com.cmendoza.catedra
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Cátedra"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Cátedra necesita acceso a Calendario para exportar sus entregas, clases y bloques de estudio al calendario «Cátedra»."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Cátedra usa el micrófono para que el guion avance mientras usted habla. El audio se procesa en este Mac y no se guarda."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Cátedra reconoce su voz en este Mac para seguir el guion mientras presenta."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.2.0
  CatedraWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: CatedraWidget
      - path: Shared
    entitlements:
      path: Config/CatedraWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - 28U4T9UK9R.com.cmendoza.catedra
    info:
      path: Config/CatedraWidget-Info.plist
      properties:
        CFBundleDisplayName: "Cátedra"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: CatedraWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.cmendoza.catedra.widget
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.2.0
  CatedraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CatedraTests
    dependencies:
      - target: Catedra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cmendoza.catedra.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Catedra.app/Contents/MacOS/Catedra"
schemes:
  Catedra:
    build:
      targets:
        Catedra: all
        CatedraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CatedraTests
