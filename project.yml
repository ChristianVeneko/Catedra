name: Catedra
options:
  bundleIdPrefix: com.cmendoza
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 28U4T9UK9R
targets:
  Catedra:
    type: application
    platform: macOS
    sources:
      - path: Catedra
        excludes:
          - "Resources/Sync/**"
      - path: Catedra/Resources/Sync/sync_moodle.py
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Catedra
        PRODUCT_BUNDLE_IDENTIFIER: com.cmendoza.catedra
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Cátedra"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  CatedraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CatedraTests
    dependencies:
      - target: Catedra
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cmendoza.catedra.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Catedra.app/Contents/MacOS/Catedra"
schemes:
  Catedra:
    build:
      targets:
        Catedra: all
        CatedraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CatedraTests
